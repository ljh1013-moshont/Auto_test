#pytest配置
[pytest]

#测试用例发现规则
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

#命令行参数(每次运行 pytest 时自动附加)


#显示详细执行信息
#简化错误堆栈输出
#禁止使用未注册标记,如果你在代码里用了 @pytest.mark.xxx 标记，但没在下面的 marks 里注册，程序会直接报错，防止你写错标记名字。
#生成html报告
#将css/js内嵌到html中，便于分享
#指定allure输出目录
#失败用例自动重试2次 这个参数需要安装 pytest-rerunfailures 插件
#重试间隔1秒

#中间尽量不要有空格
addopts =
    -v
    --tb=short
    --strict-markers
    --html=reports/report.html
    --self-contained-html
    --alluredir=reports/allure_results
    --reruns=2
     --reruns-delay=1
#自定义mark标记
markers =
    smoke: 冒烟测试用例
    regression: 回归测试用例
    slow: 执行较慢的用例
    login: 登录相关用例
    parametrize: 参数化测试
