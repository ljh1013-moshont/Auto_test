# ==============================================================================
# 流水线名称：显示在 GitHub 仓库 → Actions 页面左侧的 workflow 列表里
# ==============================================================================
name: 自动化测试

# ==============================================================================
# 触发条件：下面三个条件是「或」关系，满足任意一个就自动运行
# ==============================================================================
on:
  # 触发器 1：往 main 或 develop 分支 push 代码时触发
  push:
    branches: [main, develop]

  # 触发器 2：向 main 分支提交 Pull Request（或更新 PR）时触发
  pull_request:
    branches: [main]

  # 触发器 3：定时触发（cron 表达式）
  # 格式：分 时 日 月 周（5 段），时区是 UTC
  schedule:
    - cron: '0 2 * * *'

# ==============================================================================
# 任务定义
# ==============================================================================
jobs:
  test:
    # 运行环境：GitHub 免费提供的「最新版 Ubuntu」虚拟机
    runs-on: ubuntu-latest

    # 给这个 job 赋予写权限，否则无法把报告推送到 gh-pages 分支
    permissions:
      contents: write

    # ==========================================================================
    # 矩阵策略：1 × 2 = 2 个并行 job (chromium 和 firefox)
    # ==========================================================================
    strategy:
      matrix:
        python-version: ['3.11']
        browser: [chromium, firefox]

    steps:
      # ------------------------------------------------------------------------
      # 步骤 1：检出代码
      # ------------------------------------------------------------------------
      - name: 检出代码
        uses: actions/checkout@v4

      # ------------------------------------------------------------------------
      # 步骤 2：安装指定版本的 Python
      # ------------------------------------------------------------------------
      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # ------------------------------------------------------------------------
      # 步骤 3：安装项目依赖
      # ------------------------------------------------------------------------
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ------------------------------------------------------------------------
      # 步骤 4：安装 Playwright 浏览器
      # ------------------------------------------------------------------------
      - name: 安装 Playwright 浏览器
        run: playwright install --with-deps ${{ matrix.browser }}

      # ------------------------------------------------------------------------
      # 步骤 5：安装 Allure 命令行工具
      # 【修改】直接下载官方压缩包，替换失效的 apt 源
      # ------------------------------------------------------------------------
      - name: 安装 Allure 命令行工具
        run: |
          wget -q https://github.com/allure-framework/allure2/releases/download/2.29.0/allure-2.29.0.tgz
          tar -zxf allure-2.29.0.tgz
          sudo mv allure-2.29.0 /opt/allure
          echo "/opt/allure/bin" >> $GITHUB_PATH

      # ------------------------------------------------------------------------
      # 步骤 6：运行测试
      # 显式指定了 --alluredir，防止数据未生成导致报告为空
      # ------------------------------------------------------------------------
      - name: 运行测试
        run: pytest tests/ --browser ${{ matrix.browser }} --alluredir=reports/allure_results
        

      # ------------------------------------------------------------------------
      # 步骤 7：上传测试原始数据为构建产物（Artifact）
      # ------------------------------------------------------------------------
      - name: 上传测试结果
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-${{ matrix.browser }}
          path: reports/allure_results

      # ------------------------------------------------------------------------
      # 步骤 8：根据原始数据生成 Allure HTML 报告
      # 弃用 Docker Action，直接使用命令行工具生成（更稳定）
      # ------------------------------------------------------------------------
      - name: 生成 Allure 报告
        if: always()
        run: |
          allure generate reports/allure_results -o allure-report --clean

      # ------------------------------------------------------------------------
      # 步骤 9：把报告部署到 GitHub Pages
      # publish_dir 修改为前面命令行生成的 allure-report 目录
      # ------------------------------------------------------------------------
      - name: 部署报告到 GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./allure-report