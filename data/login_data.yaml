test_cases:
  - case_name: "管理员登录成功"
    username: "admin"
    password: "Admin@123"
    expected: "success"
    description: "使用正确的管理员账号登录"

  - case_name: "密码错误"
    username: "admin"
    password: "wrong_password"
    expected: "fail"
    error_message: "密码错误"
    description: "使用错误密码登录"

  - case_name: "用户名为空"
    username: ""
    password: "Admin@123"
    expected: "fail"
    error_message: "用户名不能为空"
    description: "用户名为空时登录"
    
  - case_name: "访客登录"
    username: "guest"
    password: "Admin@123"
    expected: "success"
    description: "访客账号登录"